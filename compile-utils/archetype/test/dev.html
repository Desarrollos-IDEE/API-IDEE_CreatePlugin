<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="api-idee" content="yes">
    <title>{{archetype.plugin.name}} TEST</title>
    <link href="https://componentes-beta.idee.es/api-idee/assets/css/apiidee{{archetype.plugin.apiidee.suffix}}.ol.min.css" rel="stylesheet" />
    <link href="https://componentes-beta.idee.es/api-idee/plugins/help/help.ol.min.css" rel="stylesheet" />
    <style rel="stylesheet">
        html,
        body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
        }
    </style>
</head>

<body>
    <div class="m-api-idee-test-form-frame">
        <div class="m-test-form">
            <div>
                <label for="selectPosicion" title="Posición del plugin sobre el mapa">Posición del plugin
                    "position"</label>
                <select name="position" id="selectPosicion">
                    <option value="left">Izquierda</option>
                    <option value="right" selected="selected">Derecha</option>
                </select>
            </div>
            <div>
                <label for="selectCollapsed"
                    title="Indica si el plugin aparece colapsado al inicio (true/false). Por defecto: true">Colapsado al
                    inicio "collapsed"</label>
                <select name="collapsed" id="selectCollapsed">
                    <option value="true" selected="selected">true</option>
                    <option value="false">false</option>
                </select>
            </div>
            <div>
                <label for="inputOrder"
                    title="Define en que posición del panel debe aparecer en el conjunto de controles o plugins">Orden
                    entre controles / plugins "order"</label>
                <input type="number" name="order" id="inputOrder" list="orderSug" value="0">
            </div>
            <div>
                <label for="inputTooltip"
                    title="Texto que se muestra al pasar el ratón sobre el botón del pluginf.">Título de la herramienta
                    "tooltip"</label>
                <input type="text" name="tooltip" id="inputTooltip" list="tooltipSug" value="Plantilla plugin">
                <datalist id="tooltipSug">
                    <option value="Plantilla plugin"></option>
                </datalist>
            </div>
        </div>
        <div class="m-test-buttons">
            <button name="eliminar" class="m-test-button" id="botonEliminar">Eliminar Plugin</button>
        </div>
    </div>
    <div id="mapjs" class="container"></div>
    <script type="text/javascript" src="https://componentes-beta.idee.es/api-idee/js/apiidee{{archetype.plugin.apiidee.suffix}}.ol.min.js"></script>
    <script type="text/javascript" src="https://componentes-beta.idee.es/api-idee/js/configuration{{archetype.plugin.apiidee.suffix}}.js"></script>
    <script type="text/javascript" src="https://componentes-beta.idee.es/api-idee/plugins/help/help.ol.min.js"></script>
    <script type="text/javascript" src="/main.js"></script>
</body>

</html>
